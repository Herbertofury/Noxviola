name: Unverified preview packages
on:
  workflow_dispatch:
  pull_request:
    paths: ['browser/**', 'scripts/package-preview.cjs', 'package*.json', '.github/workflows/preview-builds.yml']
  push:
    branches: [main]
    paths: ['browser/**', 'scripts/package-preview.cjs', 'package*.json', '.github/workflows/preview-builds.yml']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run check
      - run: npm run package:preview
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Noxviola-UNVERIFIED-preview-${{ matrix.os }}-${{ github.sha }}
          path: dist-preview/
          if-no-files-found: error
          retention-days: 14
# Build only. No native execution, signing, update feed or GitHub Release publication.
