name: Native browser acceptance

on:
  push:
    branches: ['browser/enderloom-baseline-20261115']
    paths:
      - '.gitattributes'
      - 'browser/**'
      - 'tests/native/**'
      - 'tests/native-harness.test.cjs'
      - 'scripts/native-smoke.cjs'
      - 'scripts/setup-legacy-electron.cjs'
      - 'tests/native-legacy-runtime.test.cjs'
      - 'tests/native-extension-storage.test.cjs'
      - 'scripts/package-preview.cjs'
      - 'tests/package.test.cjs'
      - 'scripts/check-source.cjs'
      - 'scripts/check-electron.cjs'
      - 'package*.json'
      - '.github/workflows/browser-native.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned JavaScript dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Download the pinned official Electron distribution
        run: npm run setup:electron
      - name: Verify installed Electron files without launching the engine
        run: npm run check:electron
      - run: rustup toolchain install stable --profile minimal
      - run: npm run build:collections
      - run: cargo test --locked --manifest-path native/tab-collections/Cargo.toml
      - run: npm test
      - run: npm run check
      - name: Verify the official previous runtime for the generated upgrade seed
        run: node scripts/setup-legacy-electron.cjs --receipt native-results/legacy-runtime.json
      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes xvfb libgtk-3-0 libnss3 libasound2
      - name: Exercise actual sandboxed Electron on Windows
        if: runner.os == 'Windows'
        run: npm run test:native -- --legacy-runtime-receipt native-results/legacy-runtime.json
      - name: Exercise actual sandboxed Electron on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:native -- --legacy-runtime-receipt native-results/legacy-runtime.json
      - name: Build and verify the complete native application package
        run: npm run package:preview -- --receipt native-results/package.json
      - name: Exercise the exact packaged Windows executable and bounded HTTPS cases
        if: runner.os == 'Windows'
        run: npm run test:native -- --package-receipt native-results/package.json --public-https --output native-results/packaged
      - name: Exercise the exact packaged Linux executable and bounded HTTPS cases
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:native -- --package-receipt native-results/package.json --public-https --output native-results/packaged
      - name: Archive the complete package and verify every extracted entry digest
        run: python tests/native/portable-archive.py --receipt native-results/package.json --output native-results/distribution
      - name: Retain exact native gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Noxviola-native-${{ matrix.os }}-${{ github.sha }}
          path: |
            native-results/
            !native-results/distribution/**
          if-no-files-found: warn
          retention-days: 14
      - name: Retain the complete portable preview with exact-byte provenance
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Noxviola-portable-${{ matrix.os }}-${{ github.sha }}
          path: native-results/distribution/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

# No continue-on-error, sandbox-disable switches, OS security changes, private
# profiles, publication tokens, GitHub Releases, or automatic merges.
