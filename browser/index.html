<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'"><title>Noxviola</title><link rel="stylesheet" href="style.css"></head><body><header><div id="tabs" role="tablist" aria-label="Browser tabs"></div><nav><select id="identity" aria-label="Browser identity"></select><button id="add-identity" title="Add named identity">♙</button><input id="identity-name" placeholder="New identity, Enter to save" aria-label="New identity name" hidden><button id="back" title="Back">←</button><button id="forward" title="Forward">→</button><button data-command="reload" title="Reload">↻</button><form id="navigate"><input id="address" aria-label="Address or search" autocomplete="off" spellcheck="false"></form><button data-command="new" title="New tab">＋</button><button data-command="split" title="Toggle split view">◫</button><button data-command="vault" title="Private vault">♡</button><input id="find" aria-label="Find in page" placeholder="Find in page"></nav><p id="notice" role="status">Noxviola · Experimental browser · Site permissions currently denied</p></header><section id="vault" hidden><h1>Your private vault</h1><p>Keep websites, videos, images, creators and characters together. Stored only on this computer. Links open at their source; nothing is scraped or uploaded.</p><div class="vault-tools"><input id="vault-search" placeholder="Search title, character, group or notes" aria-label="Search vault"><label><input id="favorites" type="checkbox"> Favorites only</label><button data-command="vault-export">Export JSON</button></div><form id="vault-add"><input name="title" placeholder="Title" required><input name="url" type="url" placeholder="https://source.example" required><select name="kind" aria-label="Item type"><option>website</option><option>image</option><option>video</option><option>creator</option><option>character</option></select><input name="group" placeholder="Collection / group"><input name="characters" placeholder="Character names"><input name="notes" placeholder="Notes and places to find them"><button>Save privately</button></form><div id="vault-items"></div></section><script src="renderer.js"></script></body></html>
